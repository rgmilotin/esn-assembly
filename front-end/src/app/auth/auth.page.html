<ion-content>
  <form class="flexBox">
    <ion-card class="authCard">
      <ion-img [src]="app.getIcon(app.isInDarkMode())"></ion-img>
      <ion-card-header>
        <ion-card-subtitle *ngIf="app.configurations.appSubtitle">
          {{ app.configurations.appSubtitle }}
        </ion-card-subtitle>
        <ion-card-title>{{ app.configurations.appTitle }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="signInButtons">
          <ion-button (click)="startLoginFlowWithESNAccounts()">
            <ion-icon slot="start" icon="/assets/icons/star-white.svg"></ion-icon>
            {{ 'AUTH.LOGIN_WITH_ESN_ACCOUNTS' | translate }}
          </ion-button>
          <ng-container *ngIf="esnAccountsOAuth">
            <ion-button (click)="startLoginFlowWithESNAccountsOAuth()">
              <ion-icon slot="start" icon="/assets/icons/star-white.svg"></ion-icon>
              {{ 'AUTH.LOGIN_WITH_ESN_ACCOUNTS_OAUTH' | translate }}
            </ion-button>
            <ion-button fill="outline" color="medium" (click)="startLoginFlowWithGoogle()">
              <ion-icon slot="start" name="logo-google"></ion-icon>
              {{ 'AUTH.LOGIN_WITH_GOOGLE' | translate }}
            </ion-button>
          </ng-container>
        </div>
        <p class="version">v{{ version }}</p>
      </ion-card-content>
    </ion-card>
  </form>
</ion-content>
